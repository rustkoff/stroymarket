name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:html && npm run check:js && npm run format:check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stroymarket .
      - name: Verify clean container startup
        run: |
          docker run -d --name store -p 3000:3000 stroymarket
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/products > products.json; then break; fi
            sleep 1
          done
          python -c "import json; assert len(json.load(open('products.json'))) >= 15"
          curl --fail http://localhost:3000/ > /dev/null
      - if: always()
        run: docker logs store
