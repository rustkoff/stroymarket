# Подключается внутри http {}; порт 80 свободен и уже разрешён firewall.
server {
    listen 80;
    listen [::]:80;
    server_name rustkoff.ru www.rustkoff.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://rustkoff.ru$request_uri; }
}
